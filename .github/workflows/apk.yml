name: Build APK

# android/ 이 바뀌면 APK 를 빌드해서 Releases 의 "apk" 에 올립니다.
# 폰에서 받기: https://github.com/happyfamily1984/diary-app/releases/download/apk/diary.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # 고정 서명 키: 저장소 Secret APK_SIGNING_PASSPHRASE(직접 정한 비밀번호) 하나만 있으면 됩니다.
      # 첫 빌드 때 키를 새로 만들어 그 비밀번호로 암호화해 android/signing/ 에 올리고, 이후에는 그 키로 서명합니다.
      # → 같은 키로 서명되므로 앱을 지우지 않고 덮어쓰기로 업데이트됩니다. Secret 이 없으면 매번 바뀌는 디버그 키.
      - name: Signing key
        env:
          PASS: ${{ secrets.APK_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo "no APK_SIGNING_PASSPHRASE: using the debug key"; exit 0; fi
          ENC=android/signing/keystore.p12.enc
          KS="$RUNNER_TEMP/diary.keystore"
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:PASS \
              || { echo "::error::APK_SIGNING_PASSPHRASE 가 키를 만들 때의 비밀번호와 달라요"; exit 1; }
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias diary -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$PASS" -dname "CN=Diary App"
            mkdir -p android/signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Add the APK signing key (encrypted with APK_SIGNING_PASSPHRASE)"
            git push
          fi
          echo "APK_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_SIGNING_PASSPHRASE }}
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk diary.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk diary.apk --title "일기장 앱 (APK)" \
            --notes "폰에서 diary.apk 를 받아 설치하세요. 화면과 기능은 웹에서 불러오므로 웹이 바뀌어도 다시 설치할 필요가 없습니다. (마이크 권한: 말로 기록하기)"
