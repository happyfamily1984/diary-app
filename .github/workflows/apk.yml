name: Build APK

# android/ 이 바뀌면 APK 를 빌드해서 Releases 의 "apk" 에 올립니다.
# 폰에서 받기: https://github.com/happyfamily1984/diary-app/releases/download/apk/diary.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk diary.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk diary.apk --title "일기장 앱 (APK)" \
            --notes "폰에서 diary.apk 를 받아 설치하세요. 화면과 기능은 웹에서 불러오므로 웹이 바뀌어도 다시 설치할 필요가 없습니다."
