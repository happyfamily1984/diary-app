plugins {
    id "com.android.application"
}

android {
    namespace "io.github.happyfamily1984.diary"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.happyfamily1984.diary"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 개인 설치용: 디버그 키로 서명 (스토어 배포 아님)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
